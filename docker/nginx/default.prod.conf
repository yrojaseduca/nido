server {
    listen 80;
    server_name nido.listocasa.es;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nido.listocasa.es;

    ssl_certificate /etc/letsencrypt/live/nido.listocasa.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nido.listocasa.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api {
        root /var/www/backend/public;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param HTTP_X_DEVICE_ID $http_x_device_id;
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }
}
