services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    volumes: !reset []
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
